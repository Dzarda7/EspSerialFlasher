---
name: Build
on:
  push:
    branches: [master]
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Arduino lint
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/arduino-lint-action@9a3603836c75e41753e531167395edeb90ba5dae  # v3.0.0
        with:
          library-manager: submit  # switch to update once listed in the Library Manager
          compliance: strict
  compile:
    name: Compile ${{ matrix.fqbn }}
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the code
    strategy:
      fail-fast: false
      matrix:
        fqbn: [esp32:esp32:esp32, esp32:esp32:esp32s3, esp32:esp32:esp32c6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/compile-sketches@d7af6619a62e765d91f0a4d65b40cf061537a15d  # v1.1.3
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
          cli-compile-flags: |-
            - --warnings
            - all
