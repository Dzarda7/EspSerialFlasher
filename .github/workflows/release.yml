---
# Runs on a version tag pushed by `cz bump` + `git push --follow-tags` and publishes a
# GitHub release with the notes from CHANGELOG.md. The Arduino Library Manager picks up
# the tag by itself.
name: Release
on:
  push:
    tags: [v*]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          # This version's section of the changelog: from its heading to the next one.
          awk -v h="## $GITHUB_REF_NAME " 'index($0, h) == 1 { p = 1; next } /^## / { p = 0 } p' CHANGELOG.md > notes.md
          git archive --prefix=EspSerialFlasher/ -o "EspSerialFlasher-$GITHUB_REF_NAME.zip" HEAD
          gh release create "$GITHUB_REF_NAME" "EspSerialFlasher-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
