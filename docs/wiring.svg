<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .title { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .sub { fill: #656d76; font-size: 13px; }
    .pin { fill: #1f2328; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .note { fill: #656d76; font-size: 12px; }
    .uart { stroke: #0969da; }
    .ctrl { stroke: #bf8700; }
    .gnd { stroke: #656d76; }
    .dot-uart { fill: #0969da; }
    .dot-ctrl { fill: #bf8700; }
    .dot-gnd { fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .title, .pin { fill: #e6edf3; }
      .sub, .note { fill: #8d96a0; }
      .uart { stroke: #4493f8; }
      .dot-uart { fill: #4493f8; }
      .ctrl { stroke: #d29922; }
      .dot-ctrl { fill: #d29922; }
      .gnd { stroke: #8d96a0; }
      .dot-gnd { fill: #8d96a0; }
    }
  </style>

  <!-- Host -->
  <rect class="box" x="10" y="10" width="220" height="280" rx="12" stroke-width="1.5"/>
  <text class="title" x="30" y="44">Host</text>
  <text class="sub" x="30" y="64">any 32-bit Arduino board</text>
  <text class="pin" x="214" y="105" text-anchor="end">TX</text>
  <text class="pin" x="214" y="145" text-anchor="end">RX</text>
  <text class="pin" x="214" y="185" text-anchor="end">reset_pin</text>
  <text class="pin" x="214" y="225" text-anchor="end">boot_pin</text>
  <text class="pin" x="214" y="265" text-anchor="end">GND</text>

  <!-- Target -->
  <rect class="box" x="490" y="10" width="220" height="280" rx="12" stroke-width="1.5"/>
  <text class="title" x="690" y="44" text-anchor="end">Target</text>
  <text class="sub" x="690" y="64" text-anchor="end">ESP32 / S / C / H / P, ESP8266</text>
  <text class="pin" x="506" y="105">RX0</text>
  <text class="pin" x="506" y="145">TX0</text>
  <text class="pin" x="506" y="185">EN</text>
  <text class="pin" x="506" y="225">BOOT</text>
  <text class="pin" x="506" y="265">GND</text>

  <!-- Wires -->
  <g stroke-width="2.5" fill="none" stroke-linecap="round">
    <line class="uart" x1="230" y1="100" x2="490" y2="100"/>
    <line class="uart" x1="230" y1="140" x2="490" y2="140"/>
    <line class="ctrl" x1="230" y1="180" x2="490" y2="180"/>
    <line class="ctrl" x1="230" y1="220" x2="490" y2="220"/>
    <line class="gnd" x1="230" y1="260" x2="490" y2="260"/>
  </g>
  <g>
    <path class="dot-uart" d="M478 94 L490 100 L478 106 Z"/>
    <path class="dot-uart" d="M242 134 L230 140 L242 146 Z"/>
    <path class="dot-ctrl" d="M478 174 L490 180 L478 186 Z"/>
    <path class="dot-ctrl" d="M478 214 L490 220 L478 226 Z"/>
    <circle class="dot-gnd" cx="230" cy="260" r="4"/>
    <circle class="dot-gnd" cx="490" cy="260" r="4"/>
  </g>
  <text class="note" x="360" y="92" text-anchor="middle">UART, 115200 then switch faster</text>
  <text class="note" x="360" y="212" text-anchor="middle">boot strapping pin: IO0, GPIO9 on most C / H</text>
</svg>
